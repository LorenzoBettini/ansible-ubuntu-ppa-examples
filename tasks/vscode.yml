# Prevent the VSCode postinst script from overwriting vscode.sources.
# The postinst always rewrites the file when it already exists, using its own
# format (different field order, extra comment header, no Enabled/X-Repolib-Name
# fields). This would differ from what deb822_repository writes, causing the
# idempotence run to report `changed`. By preseeding code/add-microsoft-repo=false,
# the postinst skips the "write sources" logic entirely.
- name: Preseed VSCode to not manage the APT repository
  become: true
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    value: 'false'
    vtype: boolean

- name: Install Visual Studio Code
  become: true
  ansible.builtin.apt:
    update_cache: true
    name: code
    state: present

# During the installation, Visual Studio Code creates the vscode.list file
# which is redundant and generates the following warning during "apt update":
# Target Packages (main/binary-amd64/Packages) is configured multiple times
- name: Remove /etc/apt/sources.list.d/vscode.list
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.list
    state: absent
