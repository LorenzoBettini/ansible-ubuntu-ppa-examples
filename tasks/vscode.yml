---
- name: Copy Microsoft apt key
  # The VSCode postinst writes the key as a binary GPG keyring to
  # /usr/share/keyrings/microsoft.gpg and references it by that path in
  # vscode.sources.  We must use the same path so that when the postinst
  # rewrites vscode.sources on every install, the Signed-By field still
  # matches what this task would write.
  #
  # To update the key:
  # - download the latest code .deb package
  # - extract the postinst script from the control archive
  # - copy the ASCII-armored key from the postinst and run:
  #   gpg --dearmor < microsoft.asc > files/microsoft.gpg
  become: true
  ansible.builtin.copy:
    src: "files/microsoft.gpg"
    dest: "/usr/share/keyrings/microsoft.gpg"
    mode: '0644'

- name: Add Microsoft APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris:
      - "https://packages.microsoft.com/repos/code"
    suites: [stable]
    components: [main]
    architectures: [amd64]
    state: present
    enabled: yes
    signed_by: /usr/share/keyrings/microsoft.gpg

- name: Install Visual Studio Code
  become: true
  ansible.builtin.apt:
    update_cache: true
    name: code
    state: present

# During the installation, Visual Studio Code creates the vscode.list file
# which is redundant and generates the following warning during "apt update":
# Target Packages (main/binary-amd64/Packages) is configured multiple times
- name: Remove /etc/apt/sources.list.d/vscode.list
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/vscode.list
    state: absent
